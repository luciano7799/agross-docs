<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envio de Documentos | Rossi & Rossi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="user-page">
  <div class="container">
    <header>
      <div class="logo-area">
        <div class="logo-icon">RR</div>
        <div>
          <h1>Grupo AgRoss</h1>
        </div>
      </div>
    </header>

    <div class="card">
      <h2>Envio de Documentos</h2>
      <p class="subtitle">Preencha os dados e anexe os arquivos desejados.</p>

      <form id="formEnvio" novalidate>

        <!-- Tipo -->
        <div class="form-group">
          <label>Tipo de pessoa <span class="req">*</span></label>
          <div class="tipo-toggle">
            <button type="button" class="tipo-btn active" data-tipo="PJ">Pessoa Jurídica</button>
            <button type="button" class="tipo-btn" data-tipo="PF">Pessoa Física</button>
          </div>
          <input type="hidden" id="tipo" name="tipo" value="PJ">
        </div>

        <!-- Documentos necessários -->
        <div class="form-group">
          <div class="docs-info" id="docsInfo">
            <div class="docs-info-title">📋 Documentos necessários para envio:</div>
            <ul class="docs-list" id="docsList"></ul>
          </div>
        </div>

        <!-- Documento (CNPJ ou CPF) -->
        <div class="form-group">
          <label for="documento" id="labelDocumento">CNPJ <span class="req">*</span></label>
          <input type="text" id="documento" name="documento" placeholder="00.000.000/0000-00" maxlength="18" required>
        </div>

        <!-- Limite de crédito bancário -->
        <div class="form-group">
          <label for="limiteCredito">Informe os limites de créditos bancários ativos <span class="req">*</span></label>
          <input type="text" id="limiteCredito" name="limiteCredito" placeholder="R$ 0,00" required>
        </div>

        <!-- Imóvel -->
        <div class="form-group">
          <label>Imóvel <span class="req">*</span></label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="imovel" value="Próprio" required> Próprio
            </label>
            <label class="radio-option">
              <input type="radio" name="imovel" value="Arrendado"> Arrendado
            </label>
            <label class="radio-option">
              <input type="radio" name="imovel" value="Parceria rural"> Parceria rural
            </label>
          </div>
        </div>

        <!-- Observação -->
        <div class="form-group">
          <label for="obs">Observação</label>
          <textarea id="obs" name="obs" rows="3" placeholder="Informações adicionais sobre os documentos..."></textarea>
        </div>

        <!-- Upload -->
        <div class="form-group">
          <label>Arquivos <span class="req">*</span></label>
          <div class="drop-zone" id="dropZone">
            <input type="file" id="arquivos" name="arquivos" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.txt,.zip">
            <div class="drop-icon">📁</div>
            <p>Arraste os arquivos aqui ou <strong>clique para selecionar</strong></p>
            <small>PDF, Word, Excel, imagens, ZIP — até 20MB por arquivo</small>
          </div>
          <ul id="listaArquivos" class="file-list"></ul>
        </div>

        <button type="submit" class="btn-primary" id="btnEnviar">Enviar Documentos</button>
      </form>

      <div id="msgSucesso" class="alert alert-success" style="display:none">
        ✅ Documentos enviados com sucesso! Obrigado.
      </div>
      <div id="msgErro" class="alert alert-error" style="display:none"></div>
    </div>
  </div>

  <script>
    // ── Documentos por tipo ───────────────────────────────────────
    const DOCS = {
      PJ: [
        'Contrato social consolidado',
        'Cartão CNPJ',
        'RG e CPF ou CNH do sócio',
        'Comprovante de endereço do sócio',
        'Ata de eleição, se o caso',
        'Balanço patrimonial e DRE',
        'Fluxo de caixa',
        'Balancete atualizado',
        'ECF',
        'Endividamento bancário',
      ],
      PF: [
        'RG e CPF ou CNH',
        'Comprovante de endereço',
        'Certidão de casamento; Ou Pacto antinupcial; Ou Declaração de união estável',
        'Procuração, se o caso',
        'Livro caixa produtor rural',
        'Extratos bancários',
        'Relação de dívidas bancárias',
        'Endividamento rural vigente',
      ],
    };

    function atualizarDocs(tipo) {
      const lista = document.getElementById('docsList');
      lista.innerHTML = DOCS[tipo].map(d => `<li>${d}</li>`).join('');
    }

    // ── Tipo toggle ───────────────────────────────────────────────
    const tipoBtns = document.querySelectorAll('.tipo-btn');
    const inputTipo = document.getElementById('tipo');
    const inputDoc  = document.getElementById('documento');
    const labelDoc  = document.getElementById('labelDocumento');

    atualizarDocs('PJ');

    tipoBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tipoBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tipo = btn.dataset.tipo;
        inputTipo.value = tipo;
        inputDoc.value = '';
        atualizarDocs(tipo);
        if (tipo === 'PF') {
          labelDoc.innerHTML = 'CPF <span class="req">*</span>';
          inputDoc.placeholder = '000.000.000-00';
          inputDoc.maxLength = 14;
        } else {
          labelDoc.innerHTML = 'CNPJ <span class="req">*</span>';
          inputDoc.placeholder = '00.000.000/0000-00';
          inputDoc.maxLength = 18;
        }
      });
    });

    // ── Máscara moeda ─────────────────────────────────────────────
    document.getElementById('limiteCredito').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '');
      if (!v) { this.value = ''; return; }
      v = (parseInt(v, 10) / 100).toFixed(2);
      this.value = 'R$ ' + v.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    });

    // ── Máscaras ──────────────────────────────────────────────────
    inputDoc.addEventListener('input', function () {
      const tipo = inputTipo.value;
      let v = this.value.replace(/\D/g, '');
      if (tipo === 'PF') {
        v = v.slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      } else {
        v = v.slice(0, 14);
        v = v.replace(/^(\d{2})(\d)/, '$1.$2');
        v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
        v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
        v = v.replace(/(\d{4})(\d)/, '$1-$2');
      }
      this.value = v;
    });

    // ── Upload ────────────────────────────────────────────────────
    const dropZone = document.getElementById('dropZone');
    const inputArquivos = document.getElementById('arquivos');
    const listaArquivos = document.getElementById('listaArquivos');
    let arquivosSelecionados = [];

    dropZone.addEventListener('click', () => inputArquivos.click());
    inputArquivos.addEventListener('click', e => e.stopPropagation());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      adicionarArquivos([...e.dataTransfer.files]);
    });
    inputArquivos.addEventListener('change', () => adicionarArquivos([...inputArquivos.files]));

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function adicionarArquivos(novos) {
      novos.forEach(f => {
        if (!arquivosSelecionados.find(a => a.name === f.name && a.size === f.size))
          arquivosSelecionados.push(f);
      });
      renderLista();
    }

    function removerArquivo(idx) {
      arquivosSelecionados.splice(idx, 1);
      renderLista();
    }

    function renderLista() {
      listaArquivos.innerHTML = arquivosSelecionados.map((f, i) => `
        <li>
          <span class="file-name">${f.name}</span>
          <span class="file-size">${formatSize(f.size)}</span>
          <button type="button" class="btn-remove" onclick="removerArquivo(${i})">✕</button>
        </li>`).join('');
    }

    // ── Envio ─────────────────────────────────────────────────────
    document.getElementById('formEnvio').addEventListener('submit', async e => {
      e.preventDefault();
      const msgErro    = document.getElementById('msgErro');
      const msgSucesso = document.getElementById('msgSucesso');
      msgErro.style.display = 'none';
      msgSucesso.style.display = 'none';

      const tipo      = inputTipo.value;
      const documento = inputDoc.value.trim();

      if (!documento) { msgErro.textContent = `Informe o ${tipo === 'PF' ? 'CPF' : 'CNPJ'}.`; msgErro.style.display = 'block'; return; }
      if (arquivosSelecionados.length === 0) { msgErro.textContent = 'Selecione ao menos um arquivo.'; msgErro.style.display = 'block'; return; }

      const formData = new FormData();
      const limiteCredito = document.getElementById('limiteCredito').value.trim();
      if (!limiteCredito) { msgErro.textContent = 'Informe os limites de créditos bancários ativos.'; msgErro.style.display = 'block'; return; }

      const imovelEl = document.querySelector('input[name="imovel"]:checked');
      if (!imovelEl) { msgErro.textContent = 'Selecione o tipo de imóvel.'; msgErro.style.display = 'block'; return; }

      formData.append('tipo', tipo);
      formData.append('cnpj', documento);
      formData.append('limiteCredito', limiteCredito);
      formData.append('imovel', imovelEl.value);
      formData.append('obs', document.getElementById('obs').value);
      arquivosSelecionados.forEach(f => formData.append('arquivos', f));

      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const res  = await fetch('/upload', { method: 'POST', body: formData });
        const json = await res.json();
        if (json.ok) {
          msgSucesso.style.display = 'block';
          document.getElementById('formEnvio').reset();
          tipoBtns.forEach((b, i) => b.classList.toggle('active', i === 0));
          inputTipo.value = 'PJ';
          labelDoc.innerHTML = 'CNPJ <span class="req">*</span>';
          inputDoc.placeholder = '00.000.000/0000-00';
          inputDoc.maxLength = 18;
          arquivosSelecionados = [];
          renderLista();
        } else {
          msgErro.textContent = json.msg || 'Erro ao enviar.';
          msgErro.style.display = 'block';
        }
      } catch {
        msgErro.textContent = 'Erro de conexão. Tente novamente.';
        msgErro.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar Documentos';
      }
    });
  </script>
</body>
</html>
